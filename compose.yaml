name: meetbroker

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meetbroker}
      POSTGRES_USER: ${POSTGRES_USER:-meetbroker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meetbroker}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    command:
      [
        "sh",
        "-c",
        "npm run db:migrate:prod --workspace @meetbroker/api && npm run db:seed:prod --workspace @meetbroker/api"
      ]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://meetbroker:meetbroker@postgres:5432/meetbroker}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    command: npm run start --workspace @meetbroker/api
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: 3000
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://meetbroker:meetbroker@postgres:5432/meetbroker}
      UPLOAD_DIR: /app/storage/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - uploads:/app/storage/uploads

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    command: npm run worker --workspace @meetbroker/api
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgres://meetbroker:meetbroker@postgres:5432/meetbroker}
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      PORT: 4173
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  postgres-data:
  uploads:
