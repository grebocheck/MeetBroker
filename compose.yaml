name: meetbroker

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meetbroker}
      POSTGRES_USER: ${POSTGRES_USER:-meetbroker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meetbroker}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    image: meetbroker-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    command:
      - sh
      - -c
      - >-
        npm run db:migrate:prod --workspace @meetbroker/api &&
        if [ "$${SEED_DEMO_DATA}" = "true" ]; then
          npm run db:seed:prod --workspace @meetbroker/api;
        else
          echo "Demo seed skipped";
        fi &&
        exec npm run start --workspace @meetbroker/api
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      APP_MODE: ${APP_MODE:-DEMO}
      API_PORT: 3000
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://meetbroker:meetbroker@postgres:5432/meetbroker}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      UPLOAD_DIR: /app/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - uploads:/app/storage/uploads

  worker:
    image: meetbroker-api:local
    command: npm run worker --workspace @meetbroker/api
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgres://meetbroker:meetbroker@postgres:5432/meetbroker}
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      PORT: 4173
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/ >/dev/null && wget -qO- http://127.0.0.1/api/health >/dev/null",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  uploads:
