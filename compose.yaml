name: meetbroker

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meetbroker}
      POSTGRES_USER: ${POSTGRES_USER:-meetbroker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meetbroker}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    image: meetbroker-api:local
    restart: unless-stopped
    init: true
    read_only: true
    stop_grace_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    command:
      - sh
      - -c
      - >-
        if [ "$${APP_MODE}" = "PRODUCTION" ] &&
        [ "$${SEED_DEMO_DATA}" = "true" ]; then
          echo "SEED_DEMO_DATA must be false when APP_MODE=PRODUCTION" >&2;
          exit 78;
        fi &&
        npm run db:migrate:prod --workspace @meetbroker/api &&
        if [ "$${SEED_DEMO_DATA}" = "true" ]; then
          npm run db:seed:prod --workspace @meetbroker/api;
        else
          echo "Demo seed skipped";
        fi &&
        exec npm run start --workspace @meetbroker/api
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      APP_MODE: ${APP_MODE:-DEMO}
      API_PORT: 3000
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://meetbroker:meetbroker@postgres:5432/meetbroker}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      UPLOAD_DIR: /app/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - uploads:/app/storage/uploads

  worker:
    image: meetbroker-api:local
    restart: unless-stopped
    init: true
    read_only: true
    stop_grace_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: npm run worker --workspace @meetbroker/api
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgres://meetbroker:meetbroker@postgres:5432/meetbroker}
      SMTP_HOST: ${SMTP_HOST:-}
      TELEGRAM_UPDATE_MODE: ${TELEGRAM_UPDATE_MODE:-DISABLED}
      WORKER_HEARTBEAT_FILE: /tmp/meetbroker-worker-heartbeat.json
      WORKER_HEARTBEAT_MAX_AGE_SECONDS: ${WORKER_HEARTBEAT_MAX_AGE_SECONDS:-45}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "apps/api/dist/worker-health.js"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    tmpfs:
      - /tmp:size=64m,mode=1777

  nginx:
    image: meetbroker-nginx:local
    restart: unless-stopped
    init: true
    read_only: true
    stop_grace_period: 15s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/ >/dev/null && wget -qO- http://127.0.0.1:8080/api/health >/dev/null",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    tmpfs:
      - /tmp:size=32m,mode=1777

volumes:
  postgres-data:
  uploads:
