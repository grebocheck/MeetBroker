services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for production}

  api:
    env_file:
      - path: .env
        required: true
    environment:
      NODE_ENV: production
      APP_MODE: PRODUCTION
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN for production}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL for production}
      SEED_DEMO_DATA: "false"

  worker:
    env_file:
      - path: .env
        required: true
    environment:
      NODE_ENV: production
      APP_MODE: PRODUCTION
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN for production}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL for production}
      SEED_DEMO_DATA: "false"
