name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate pull request commit subjects
        if: github.event_name == 'pull_request'
        run: >-
          node scripts/check-commit-messages.mjs
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    name: API and browser regression
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SEED_DEMO_DATA: "true"
      EMAIL_VERIFICATION_REQUIRED: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: cp .env.example .env
      - name: Validate production Compose override
        run: >-
          docker compose
          -f compose.yaml
          -f compose.production.yaml
          config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 180
      - name: Verify container security boundaries
        run: |
          set -eu
          for service in api worker web nginx; do
            container_id="$(docker compose ps -q "$service")"
            test -n "$container_id"
            test "$(docker compose exec -T "$service" id -u)" != "0"
            test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$container_id")" = "true"
            test "$(docker inspect --format '{{json .HostConfig.CapDrop}}' "$container_id")" = '["ALL"]'
          done
      - run: npm run smoke
      - name: Reset in-memory guards before browser suite
        run: |
          docker compose restart api
          docker compose up -d --wait --wait-timeout 60
      - run: npm run test:e2e
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down --volumes
