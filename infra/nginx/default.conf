resolver 127.0.0.11 valid=10s ipv6=off;

upstream meetbroker_api {
    zone meetbroker_api 64k;
    server api:3000 resolve;
}

upstream meetbroker_web {
    zone meetbroker_web 64k;
    server web:4173 resolve;
}

server {
    listen 80;
    server_name _;
    # API accepts image payloads up to 12 MiB; leave room for multipart metadata.
    client_max_body_size 13m;

    location /api/ {
        proxy_pass http://meetbroker_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://meetbroker_api;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://meetbroker_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
}
